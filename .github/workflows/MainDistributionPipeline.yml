#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  prepare:
    name: Prepare
    runs-on: ${{ github.repository_owner == 'duckdb' && 'namespace-profile-linux-slim' || 'ubuntu-slim' }}
    outputs:
      runners: ${{ steps.runners.outputs.runners }}
    steps:
      - name: Detect runners
        id: runners
        uses: duckdb/duckdb-ci/detect-runners@main

  # Pin the duckdb build to the commit our submodule references (.github/duckdb-version), instead of
  # tracking duckdb main — otherwise upstream-main API drift breaks CI on changes unrelated to this repo.
  get-duckdb-version:
    name: Get DuckDB version
    runs-on: ubuntu-latest
    outputs:
      duckdb_version: ${{ steps.version.outputs.duckdb_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - id: version
        run: echo "duckdb_version=$(cat .github/duckdb-version)" >> "$GITHUB_OUTPUT"

  build:
    name: Build extension
    needs: prepare
    uses: duckdb/extension-ci-tools/.github/workflows/build.yml@main
    with:
      groups: |
        main:
          config: extension_config.cmake
          toolchain: main
      runners: ${{ needs.prepare.outputs.runners }}

  fts-regression:
    name: FTS regression benchmarks
    uses: ./.github/workflows/Regression.yml
    with:
      git_ref: ${{ github.sha }}

  deploy:
    name: Deploy extension
    needs: [build, fts-regression]
    uses: duckdb/extension-ci-tools/.github/workflows/deploy.yml@main
    secrets: inherit
    with:
      duckdb_version: ${{ needs.build.outputs.duckdb_version }}
      duckdb_commit: ${{ needs.build.outputs.duckdb_commit }}
      deploy_extensions: fts

  code-quality-check:
    name: Code Quality Check
    needs: get-duckdb-version
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@main
    with:
      duckdb_version: ${{ needs.get-duckdb-version.outputs.duckdb_version }}
      ci_tools_version: main
      extension_name: fts
      format_checks: 'format;tidy'
