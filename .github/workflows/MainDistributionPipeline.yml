#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  prepare:
    name: Prepare
    runs-on: ${{ github.repository_owner == 'duckdb' && 'namespace-profile-linux-slim' || 'ubuntu-slim' }}
    outputs:
      runners: ${{ steps.runners.outputs.runners }}
    steps:
      - name: Detect runners
        id: runners
        uses: duckdb/duckdb-ci/detect-runners@main

  check-duckdb-version:
    name: Check DuckDB version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - name: Check .github/duckdb-version matches the duckdb submodule
        run: |
          pinned="$(cat .github/duckdb-version)"
          submodule="$(git ls-tree HEAD duckdb | awk '{print $3}')"
          if [[ "$pinned" != "$submodule" ]]; then
            echo "::error file=.github/duckdb-version::.github/duckdb-version ($pinned) does not match the duckdb submodule ($submodule)"
            exit 1
          fi

  build:
    name: Build extension
    needs: [prepare, check-duckdb-version]
    uses: duckdb/extension-ci-tools/.github/workflows/build.yml@main
    with:
      reduced_ci_mode: disabled
      opt_in_archs: osx_amd64
      groups: |
        main:
          config: extension_config.cmake
          toolchain: main
      runners: ${{ needs.prepare.outputs.runners }}

  fts-regression:
    name: FTS regression benchmarks
    uses: ./.github/workflows/Regression.yml
    with:
      git_ref: ${{ github.sha }}

  deploy:
    name: Deploy extension
    needs: [build, fts-regression]
    uses: duckdb/extension-ci-tools/.github/workflows/deploy.yml@main
    secrets: inherit
    with:
      duckdb_version: ${{ needs.build.outputs.duckdb_version }}
      duckdb_commit: ${{ needs.build.outputs.duckdb_commit }}
      deploy_extensions: fts

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@v2.0-cyanoptera
    with:
      ci_tools_version: v2.0-cyanoptera
      extension_name: fts
      format_checks: 'format;tidy'
